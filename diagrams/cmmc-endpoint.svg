<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Verdana, Geneva, sans-serif" role="img" aria-label="Two control planes — Google Workspace for identity and Jamf for devices — push enforcement down onto a managed macOS and iOS fleet, which reports compliance and events back up into central logging that serves as assessment evidence.">
  <rect width="900" height="520" fill="#ffffff"/>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3366cc"/></marker>
    <marker id="u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#339933"/></marker>
  </defs>

  <text x="24" y="30" font-size="15" font-weight="bold" fill="#113366">CMMC L2 — where each control is actually enforced</text>
  <text x="24" y="48" font-size="11" fill="#666666">Two control planes. Nothing is enforced by policy document alone.</text>

  <!-- identity plane -->
  <rect x="24" y="66" width="400" height="130" fill="#fff8e6" stroke="#e6a700" stroke-width="2"/>
  <rect x="24" y="66" width="400" height="22" fill="#ffcc00"/>
  <text x="34" y="82" font-size="12" font-weight="bold" fill="#663300">IDENTITY PLANE — Google Workspace</text>
  <text x="36" y="106" font-size="11" fill="#443300">• SSO with enforced MFA, session limits</text>
  <text x="36" y="124" font-size="11" fill="#443300">• Directory is the authoritative user list</text>
  <text x="36" y="142" font-size="11" fill="#443300">• Drive sharing + trust rules (CUI flow)</text>
  <text x="36" y="160" font-size="11" fill="#443300">• OAuth apps restricted — deny by default</text>
  <text x="36" y="178" font-size="11" fill="#443300">• Admin audit log, account lifecycle</text>

  <!-- device plane -->
  <rect x="476" y="66" width="400" height="130" fill="#eef7ee" stroke="#339933" stroke-width="2"/>
  <rect x="476" y="66" width="400" height="22" fill="#66cc66"/>
  <text x="486" y="82" font-size="12" font-weight="bold" fill="#14521a">DEVICE PLANE — Jamf Pro + Jamf Protect</text>
  <text x="488" y="106" font-size="11" fill="#143d19">• Configuration profiles — the baseline, pushed</text>
  <text x="488" y="124" font-size="11" fill="#143d19">• Compliance benchmark (NIST/NSA/DISA/Apple)</text>
  <text x="488" y="142" font-size="11" fill="#143d19">• FileVault enforced, recovery key escrowed</text>
  <text x="488" y="160" font-size="11" fill="#143d19">• Removable media blocked, endpoint detection</text>
  <text x="488" y="178" font-size="11" fill="#143d19">• Enrollment = device identity + inventory</text>

  <!-- enforce arrows -->
  <line x1="224" y1="196" x2="224" y2="252" stroke="#3366cc" stroke-width="2.5" marker-end="url(#d)"/>
  <text x="234" y="228" font-size="11" fill="#3366cc" font-weight="bold">enforces</text>
  <line x1="676" y1="196" x2="676" y2="252" stroke="#3366cc" stroke-width="2.5" marker-end="url(#d)"/>
  <text x="686" y="228" font-size="11" fill="#3366cc" font-weight="bold">enforces</text>

  <!-- the fleet -->
  <rect x="24" y="254" width="852" height="96" fill="#eef4ff" stroke="#3366cc" stroke-width="2"/>
  <rect x="24" y="254" width="852" height="22" fill="#5588dd"/>
  <text x="34" y="270" font-size="12" font-weight="bold" fill="#ffffff">THE ASSESSED FLEET — company-issued, enrolled, one named owner each</text>

  <rect x="60" y="290" width="300" height="44" fill="#ffffff" stroke="#3366cc"/>
  <text x="210" y="309" font-size="12" font-weight="bold" fill="#113366" text-anchor="middle">macOS — MacBooks</text>
  <text x="210" y="326" font-size="10" fill="#556677" text-anchor="middle">settings are configured, and evidenced as configured</text>

  <rect x="540" y="290" width="300" height="44" fill="#ffffff" stroke="#3366cc"/>
  <text x="690" y="309" font-size="12" font-weight="bold" fill="#113366" text-anchor="middle">iOS — iPhones</text>
  <text x="690" y="326" font-size="10" fill="#556677" text-anchor="middle">much is platform behaviour, inherited not set</text>

  <path d="M400 312 L500 312" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="450" y="306" font-size="9.5" fill="#777777" text-anchor="middle">same objective,</text>
  <text x="450" y="326" font-size="9.5" fill="#777777" text-anchor="middle">different evidence</text>

  <!-- report arrows -->
  <line x1="450" y1="350" x2="450" y2="392" stroke="#339933" stroke-width="2.5" marker-end="url(#u)"/>
  <text x="460" y="374" font-size="11" fill="#1d6b1d" font-weight="bold">reports compliance state + security events</text>

  <!-- evidence -->
  <rect x="24" y="394" width="852" height="100" fill="#fdeef6" stroke="#cc3399" stroke-width="2"/>
  <rect x="24" y="394" width="852" height="22" fill="#cc3399"/>
  <text x="34" y="410" font-size="12" font-weight="bold" fill="#ffffff">EVIDENCE — what an assessor is actually shown</text>
  <text x="40" y="434" font-size="11" fill="#5a1140">• Fleet-wide compliance state, not a screenshot of one laptop</text>
  <text x="40" y="452" font-size="11" fill="#5a1140">• Managed profiles render settings non-modifiable — "cannot be made incorrect", not "is correct today"</text>
  <text x="40" y="470" font-size="11" fill="#5a1140">• Forwarded audit records survive the device that produced them</text>
  <text x="40" y="488" font-size="11" fill="#5a1140">• Live demonstration during assessment — where evidence either holds up or does not</text>

  <text x="24" y="512" font-size="10" fill="#888888">Control families answered: AC · AU · CM · IA · MA · MP · SC · SI  —  85 objectives across the two planes.</text>
</svg>
