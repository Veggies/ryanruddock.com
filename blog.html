<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog - ryanruddock.com</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐶</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"
        integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx"
        crossorigin="anonymous"></script>
<script src="./blog-render.js"></script>
<link rel="stylesheet" href="./blog-post.css">
<style>
/* ============================================================
   RYAN'S WEBLOG  ::  same starfield, same shell as the homepage
   ============================================================ */

body {
  margin: 0;
  padding: 12px 8px 30px;
  box-sizing: border-box;
  min-height: 100vh;
  font-family: Verdana, Geneva, "MS Sans Serif", sans-serif;
  font-size: 12px;
  color: #000000;
  background-color: #110033;
  background-image:
    radial-gradient(1.5px 1.5px at 18px 14px, #ffffff 99%, transparent 100%),
    radial-gradient(1px 1px at 62px 40px, #ffff99 99%, transparent 100%),
    radial-gradient(1px 1px at 34px 70px, #ccddff 99%, transparent 100%),
    radial-gradient(2px 2px at 88px 86px, #ffffff 99%, transparent 100%),
    radial-gradient(1px 1px at 8px 52px, #99bbff 99%, transparent 100%),
    linear-gradient(#000055, #110033);
  background-size: 110px 110px, 110px 110px, 110px 110px, 110px 110px, 110px 110px, 100% 100%;
  background-repeat: repeat, repeat, repeat, repeat, repeat, no-repeat;
  background-attachment: scroll, scroll, scroll, scroll, scroll, fixed;
}

img { max-width: 100%; }
[hidden] { display: none !important; }

a { color: #0000cc; }
a:visited { color: #660099; }
a:hover { color: #ff0000; }

.page {
  max-width: 820px;
  margin: 0 auto;
  background: #ffffff;
  border: 4px ridge #ffcc00;
  padding: 6px;
}

.banner {
  border: 3px outset #6699ff;
  background: #3366cc;
  background-image: linear-gradient(#66aaff, #3366cc 45%, #113388);
  text-align: center;
  padding: 14px 10px 10px;
}
.banner h1 {
  margin: 0;
  font-family: "Comic Sans MS", "Chalkboard SE", cursive;
  font-size: 34px;
  line-height: 1.1;
  color: #ffdd00;
  text-shadow: 3px 3px 0 #000066, -1px -1px 0 #000066, 1px -1px 0 #000066, -1px 1px 0 #000066;
  letter-spacing: 1px;
}
.banner h1 a, .banner h1 a:visited { color: inherit; text-decoration: none; }
.banner .tag {
  margin: 6px 0 0;
  font-family: "Comic Sans MS", cursive;
  font-size: 13px;
  color: #ffffff;
  text-shadow: 1px 1px 0 #002266;
}

.mod {
  border: 2px solid #cc3399;
  border-radius: 10px;
  background: #ffffff;
  margin-top: 6px;
  overflow: hidden;
}
.mod > h2 {
  margin: 0;
  font-family: "Comic Sans MS", cursive;
  font-size: 13px;
  color: #ffffff;
  background-image: linear-gradient(#ee77cc, #cc3399 60%, #99126f);
  padding: 4px 8px;
  text-shadow: 1px 1px 0 #113377;
}
.mod > .body { padding: 10px 12px; }

.crumbs { margin-top: 6px; font-size: 11px; }
.crumbs a { font-weight: bold; }

/* ---- the index of posts ---- */
ul.posts { list-style: none; margin: 0; padding: 0; }
ul.posts li { border-bottom: 1px dotted #aaaaaa; padding: 6px 2px; font-size: 12px; }
ul.posts li:last-child { border-bottom: 0; }
ul.posts a { font-weight: bold; }
ul.posts .when { color: #777777; font-size: 10px; margin-left: 4px; }
.empty { font-size: 11px; color: #666666; font-style: italic; margin: 0; }


/* ---- view counter: the homepage's red LED digits ---- */
.views { float: right; margin: -2px 0 6px 10px; text-align: center; font-family: "Courier New", monospace; }
.views .digits {
  display: inline-block;
  background: #000000;
  border: 2px inset #999999;
  padding: 1px 4px;
  letter-spacing: 2px;
  font-size: 14px;
  color: #ff3300;
  text-shadow: 0 0 4px #ff6600;
}
.views small { display: block; font-size: 9px; color: #555555; }
ul.posts .views-n { color: #cc3300; font-size: 10px; margin-left: 4px; }

/* ---- comments: the guestbook's green module ---- */
.mod.green { border-color: #339933; }
.mod.green > h2 { background-image: linear-gradient(#66cc66, #339933 60%, #1d6b1d); }
.c-form { background: #eef4ff; border: 2px inset #cccccc; padding: 8px; margin-bottom: 8px; }
.c-row { margin-bottom: 6px; }
.c-row label { display: block; font-size: 10px; font-weight: bold; color: #003399; margin-bottom: 2px; letter-spacing: 0.5px; }
.c-form input[type="text"], .c-form textarea {
  width: 100%;
  box-sizing: border-box;
  border: 2px inset #bbbbbb;
  background: #ffffff;
  font-family: Verdana, sans-serif;
  font-size: 11px;
  padding: 4px;
}
.c-form textarea { resize: vertical; min-height: 70px; }
.c-trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.c-submit {
  border: 2px outset #ffd94d;
  background: linear-gradient(#ffe680, #ffcc00 55%, #e6a700);
  color: #663300;
  font-family: "Comic Sans MS", cursive;
  font-weight: bold;
  font-size: 12px;
  padding: 4px 16px;
  cursor: pointer;
}
.c-submit:hover { border-style: inset; color: #cc0000; }
.c-submit[disabled] { opacity: 0.6; cursor: default; }
.c-status { font-size: 10px; font-weight: bold; margin: 6px 0 0; min-height: 13px; }
.c-status.ok  { color: #007700; }
.c-status.err { color: #cc0000; }
.linkish { border: 0; background: none; padding: 0; color: #0000cc; text-decoration: underline; cursor: pointer; font: inherit; }
.linkish:hover { color: #ff0000; }

.c-entry { border-top: 1px dashed #99aabb; padding: 7px 2px; }
.c-entry:first-child { border-top: 0; }
.c-head { font-size: 10px; color: #666666; margin-bottom: 3px; }
.c-head .who { font-weight: bold; color: #cc0066; font-size: 11px; }
.c-badge { font-size: 9px; font-weight: bold; padding: 0 4px; margin-left: 4px; border: 1px solid; }
.c-badge.author { color: #663300; border-color: #e6a700; background: #ffeeaa; }
.c-msg { font-size: 12px; line-height: 1.55; margin: 0; white-space: pre-wrap; overflow-wrap: break-word; }
.c-del { float: right; font-size: 10px; }

.footer {
  margin-top: 6px;
  border: 2px inset #cccccc;
  background: #f4f4f4;
  padding: 8px;
  text-align: center;
  font-size: 10px;
  color: #444444;
  line-height: 1.7;
}
.footer a { font-weight: bold; }

@media (max-width: 640px) {
  .banner h1 { font-size: 22px; }
}
</style>
</head>
<body>

<div class="page">

  <div class="banner">
    <h1><a href="./blog.html">Ryan's Weblog</a></h1>
    <p class="tag">Notes from ryanruddock.com</p>
  </div>

  <p class="crumbs">
    &#9664; <a href="./index.html">Back to the homepage</a>
    <span id="crumb-index" hidden> &nbsp;&middot;&nbsp; <a href="./blog.html">All posts</a></span>
  </p>

  <div class="mod" id="view">
    <h2 id="view-title">&#9998; All Posts</h2>
    <div class="body" id="view-body">
      <p class="empty">Loading&hellip;</p>
    </div>
  </div>

  <div class="mod green" id="comments" hidden>
    <h2 id="comments-title">&#9998; Comments</h2>
    <div class="body">

      <form class="c-form" id="c-form" autocomplete="off">
        <div class="c-row">
          <label for="c-name">YOUR NAME</label>
          <input type="text" id="c-name" maxlength="40" placeholder="Anonymous Neopian" autocomplete="nickname">
        </div>
        <!-- honeypot: hidden from people, so only a bot fills it in -->
        <div class="c-trap" aria-hidden="true">
          <label for="c-website">Leave this empty</label>
          <input type="text" id="c-website" tabindex="-1" autocomplete="off">
        </div>
        <div class="c-row">
          <label for="c-message">COMMENT</label>
          <textarea id="c-message" maxlength="1000" required placeholder="Great post!!!"></textarea>
        </div>
        <button type="submit" class="c-submit" id="c-submit">&#9998; Post Comment</button>
        <p class="c-status" id="c-status" role="status"></p>
      </form>

      <div id="c-list"></div>

    </div>
  </div>

  <div class="footer">
    <a href="./index.html">Home</a> &nbsp;&middot;&nbsp;
    <a href="./index.html#guestbook">Sign my Guestbook</a><br>
    &copy; Ryan Ruddock
  </div>

</div>

<script>
(function () {
  "use strict";

  /* Same API base logic as index.html: same-origin on localhost so
     local/server.py answers, the Lambda function URL everywhere else. */
  var API_BASE_URL = "https://lf55pi6yjah4v6g4sqd42x7bue0mtwaw.lambda-url.us-east-1.on.aws";
  var IS_LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])?$/.test(location.hostname);
  var API = IS_LOCAL ? "" : API_BASE_URL;

  var titleEl = document.getElementById("view-title");
  var bodyEl  = document.getElementById("view-body");

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text) { node.textContent = text; }
    return node;
  }

  /* ============ small storage helpers; a private window may refuse ============ */

  function getItem(store, key) {
    try { return window[store].getItem(key) || ""; } catch (e) { return ""; }
  }
  function setItem(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* not remembered */ }
  }

  /* the homepage's per-browser id, so a reload is not a second view */
  function visitorId() {
    var id = getItem("localStorage", "ryan-den-visitor");
    if (!id) {
      id = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID().replace(/-/g, "")
        : String(Date.now()) + Math.random().toString(36).slice(2, 12);
      setItem("ryan-den-visitor", id);
    }
    return id;
  }

  /* Logged in to write.html in this browser? Then comments get delete
     buttons and your own comments are marked as the author's. The server
     checks the token; this only decides what to draw. */
  var authorToken = getItem("localStorage", "ryan-blog-token") || getItem("sessionStorage", "ryan-blog-token");

  function pad(n) {
    var s = String(n);
    while (s.length < 5) { s = "0" + s; }
    return s;
  }

  /* ============ views ============ */

  function showError(text) {
    bodyEl.textContent = "";
    bodyEl.appendChild(el("p", "empty", text));
  }

  function showIndex() {
    fetch(API + "/api/posts")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        bodyEl.textContent = "";
        if (!d.posts || !d.posts.length) {
          showError("No posts yet. Check back soon!");
          return;
        }
        var list = el("ul", "posts");
        d.posts.forEach(function (p) {
          var li = document.createElement("li");
          var a = el("a", "", p.title);
          a.href = "./blog.html?p=" + encodeURIComponent(p.id);
          li.appendChild(document.createTextNode("★ "));
          li.appendChild(a);
          li.appendChild(el("span", "when", "· " + BlogRender.formatDate(p.when)));
          if (p.views) {
            li.appendChild(el("span", "views-n", "\u00b7 " + p.views + (p.views === 1 ? " view" : " views")));
          }
          list.appendChild(li);
        });
        bodyEl.appendChild(list);
      })
      .catch(function () { showError("The blog is unavailable right now. Try again later."); });
  }

  function showPost(id) {
    document.getElementById("crumb-index").hidden = false;
    fetch(API + "/api/posts/" + encodeURIComponent(id))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.post) {
          titleEl.textContent = "☹ Not Found";
          showError("That post does not exist (or was taken down).");
          return;
        }
        var p = d.post;
        document.title = p.title + " - ryanruddock.com";
        titleEl.textContent = "✎ " + p.title;
        bodyEl.textContent = "";

        var counter = el("div", "views");
        counter.hidden = true;
        var digits = el("span", "digits", "00000");
        counter.appendChild(digits);
        counter.appendChild(el("small", "", "views"));
        bodyEl.appendChild(counter);
        bodyEl.appendChild(BlogRender.renderPost(p));

        fetch(API + "/api/posts/" + encodeURIComponent(id) + "/view", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ visitorId: visitorId() })
        })
          .then(function (r) { return r.json(); })
          .then(function (v) {
            if (typeof v.views !== "number") { return; }
            digits.textContent = pad(v.views);
            counter.hidden = false;
          })
          .catch(function () { /* no counter, no fuss */ });

        setupComments(id, d.comments || []);
      })
      .catch(function () { showError("The blog is unavailable right now. Try again later."); });
  }

  /* ============ comments ============ */

  var NAME_KEY = "ryan-den-commenter";

  var cList   = document.getElementById("c-list");
  var cForm   = document.getElementById("c-form");
  var cStatus = document.getElementById("c-status");
  var cSubmit = document.getElementById("c-submit");
  var cName   = document.getElementById("c-name");

  function setStatus(text, kind) {
    cStatus.textContent = text;
    cStatus.className = "c-status" + (kind ? " " + kind : "");
  }

  function formatWhen(iso) {
    var d = new Date(iso);
    if (isNaN(d)) { return ""; }
    return d.toLocaleDateString("en-US", { year: "numeric", month: "2-digit", day: "2-digit" }) +
           " at " + d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
  }

  function renderComments(postId, comments) {
    document.getElementById("comments-title").textContent =
      "\u270e Comments (" + comments.length + ")";
    cList.textContent = "";
    if (!comments.length) {
      cList.appendChild(el("p", "empty", "No comments yet. Be the first!"));
      return;
    }
    comments.forEach(function (c) {
      var wrap = el("div", "c-entry");
      var head = el("div", "c-head");
      if (authorToken) {
        var del = el("button", "linkish c-del", "delete");
        del.type = "button";
        del.addEventListener("click", function () { deleteComment(postId, c); });
        head.appendChild(del);
      }
      head.appendChild(el("span", "who", c.name));   // textContent: a name is never markup
      if (c.author) { head.appendChild(el("span", "c-badge author", "\u2605 AUTHOR")); }
      head.appendChild(document.createTextNode(" \u00b7 " + formatWhen(c.when)));
      wrap.appendChild(head);
      wrap.appendChild(el("p", "c-msg", c.message));
      cList.appendChild(wrap);
    });
  }

  function deleteComment(postId, c) {
    if (!confirm("Delete the comment from \u201c" + c.name + "\u201d?")) { return; }
    fetch(API + "/api/comments/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authorToken },
      body: JSON.stringify({ postId: postId, id: c.id })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) { throw new Error(d.error || "Could not delete."); }
        renderComments(postId, d.comments);
      })
      .catch(function (err) { setStatus(err.message, "err"); });
  }

  function setupComments(postId, comments) {
    document.getElementById("comments").hidden = false;
    cName.value = getItem("localStorage", NAME_KEY);
    renderComments(postId, comments);

    cForm.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var message = document.getElementById("c-message").value.trim();
      if (!message) { setStatus("Write a comment first.", "err"); return; }

      var name = cName.value.trim();
      if (name) { setItem(NAME_KEY, name); }

      cSubmit.disabled = true;
      setStatus("Posting\u2026", "");
      var headers = { "Content-Type": "application/json" };
      if (authorToken) { headers.Authorization = "Bearer " + authorToken; }

      fetch(API + "/api/posts/" + encodeURIComponent(postId) + "/comments", {
        method: "POST",
        headers: headers,
        body: JSON.stringify({
          name: name,
          message: message,
          website: document.getElementById("c-website").value
        })
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.ok) { throw new Error(d.error || "Could not post your comment."); }
          renderComments(postId, d.comments);
          document.getElementById("c-message").value = "";
          setStatus("Thanks for commenting!", "ok");
        })
        .catch(function (err) { setStatus(err.message || "Could not reach the server.", "err"); })
        .finally(function () { cSubmit.disabled = false; });
    });
  }

  var id = new URLSearchParams(location.search).get("p");
  if (id) { showPost(id); } else { showIndex(); }
})();
</script>

<!-- the cat that chases your mouse around the page -->
<script src="./neko/neko.js"></script>
</body>
</html>
